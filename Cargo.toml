[package]
name = "semantic_profile"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Semantic profiling of the values in a DuckDB table: what they mean, not what shape they are"
repository = "https://github.com/patricktrainer/duckdb-semantic-profile"
readme = "README.md"
keywords = ["duckdb", "data-quality", "profiling", "extension"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension", "vscalar", "vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
hex = "0.4"
